<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>精灵费用计算器 · 星空</title>

  s.src = 'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js';
  document.head.appendChild(s);

<style>
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  padding-bottom:132px;
  color:#dbe7ff;
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(1200px 700px at 15% 0%, rgba(38,80,180,.35), transparent 60%),
    radial-gradient(900px 600px at 85% 18%, rgba(120,50,190,.28), transparent 60%),
    radial-gradient(900px 700px at 60% 100%, rgba(20,120,160,.22), transparent 60%),
    #03050e;
  background-attachment:fixed;
  overflow-x:hidden;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;display:block;}

/* ---------- 头部 ---------- */
header{position:relative;z-index:2;text-align:center;padding:26px 16px 6px;}
h1{
  margin:0;
  font-size:clamp(20px,4vw,34px);
  letter-spacing:6px;
  font-weight:700;
  background:linear-gradient(90deg,#7fd8ff,#a58bff,#7fffe0,#7fd8ff);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 9s linear infinite;
  filter:drop-shadow(0 0 18px rgba(90,170,255,.55));
}
@keyframes shine{to{background-position:300% 0;}}
header p{margin:9px 0 0;color:#8fb3e6;font-size:13.5px;letter-spacing:2px;}

/* ---------- 布局 ---------- */
main{
  position:relative;z-index:2;
  max-width:1440px;margin:0 auto;padding:16px 20px 0;
  display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:18px;align-items:start;
}
@media (max-width:960px){
  main{grid-template-columns:1fr;}
}

.panel{
  background:rgba(12,20,45,.55);
  border:1px solid rgba(110,170,255,.18);
  border-radius:18px;
  padding:16px;
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);
  box-shadow:0 0 34px rgba(40,90,200,.13), inset 0 0 60px rgba(40,90,200,.06);
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;flex-wrap:wrap;
}
.panel-head h2{
  margin:0;font-size:17px;letter-spacing:3px;color:#9fd4ff;font-weight:600;
  text-shadow:0 0 12px rgba(80,160,255,.5);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.panel-head h2::before{content:"✦ ";color:#5ff0d0;}

/* ★ 玩家名称：面板标题可点击编辑 */
.panel-head h2.editable{cursor:pointer;transition:filter .18s;}
.panel-head h2.editable:hover{filter:brightness(1.35);}
.panel-head h2.editable::after{
  content:"✎";
  margin-left:8px;font-size:11px;opacity:.5;
  vertical-align:2px;
}
.name-input{
  flex:1 1 auto;min-width:0;max-width:190px;
  padding:5px 10px;border-radius:9px;
  background:rgba(5,14,32,.96);
  border:1px solid #5ff0d0;
  color:#5ff0d0;font-size:16px;font-weight:700;letter-spacing:2px;
  font-family:inherit;outline:none;
  box-shadow:0 0 16px rgba(95,240,208,.5);
  -moz-appearance:textfield;
}
#p2Panel .name-input{
  border-color:#ff9fe6;color:#ff9fe6;
  box-shadow:0 0 16px rgba(255,159,230,.5);
}

.head-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.edit-hint{font-size:11.5px;color:#6f8cb5;letter-spacing:.5px;white-space:nowrap;}

#search{
  width:190px;padding:8px 12px;border-radius:10px;
  background:rgba(10,20,45,.75);border:1px solid rgba(110,170,255,.25);
  color:#cfe6ff;outline:none;font-size:13px;font-family:inherit;transition:.2s;
}
#search:focus{border-color:#5ff0d0;box-shadow:0 0 14px rgba(95,240,208,.35);}
#search::placeholder{color:#5c7396;}

/* ---------- 精灵池（按费用分组） ---------- */
.pool-scroll{
  max-height:calc(100vh - 300px);
  min-height:240px;
  overflow-y:auto;
  padding:2px 8px 2px 2px;
}
.pool-scroll::-webkit-scrollbar{width:8px;}
.pool-scroll::-webkit-scrollbar-thumb{background:rgba(90,150,255,.3);border-radius:9px;}
.pool-scroll::-webkit-scrollbar-track{background:rgba(10,20,45,.4);border-radius:9px;}

.cost-group{margin-bottom:16px;}
.cost-group:last-child{margin-bottom:4px;}

.group-head{
  display:flex;align-items:center;gap:10px;
  padding:0 2px 7px;margin-bottom:10px;
  border-bottom:1px solid rgba(110,170,255,.13);
}
.group-badge{
  min-width:46px;height:22px;padding:0 10px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;letter-spacing:1px;
}
.group-count{font-size:12px;color:#6f8cb5;letter-spacing:1px;}
.group-count.repeatable{color:#5ff0d0;}

.group-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(calc(118px * var(--is,1)),1fr));
  gap:11px;
}

/* ---------- 精灵卡片 ---------- */
.card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 5px 8px;
  border-radius:13px;
  background:linear-gradient(160deg, rgba(30,50,100,.55), rgba(10,18,40,.7));
  border:1px solid rgba(110,170,255,.18);
  cursor:pointer;
  user-select:none;
  transition:transform .16s ease, box-shadow .2s, border-color .2s, background .2s;
}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(120,220,255,.6);
  box-shadow:0 10px 26px rgba(60,160,255,.25);
}
.card.selected{
  border-color:#5ff0d0;
  background:linear-gradient(160deg, rgba(18,72,84,.75), rgba(8,28,42,.8));
  box-shadow:0 0 0 2px rgba(95,240,208,.45), 0 0 24px rgba(95,240,208,.3);
}
.card.selected::before{
  content:"✓";
  position:absolute;left:6px;top:5px;z-index:3;
  width:20px;height:20px;line-height:20px;text-align:center;
  font-size:13px;font-weight:700;color:#04222b;
  background:#5ff0d0;border-radius:50%;
  box-shadow:0 0 12px rgba(95,240,208,.8);
}
.card.blocked{opacity:.32;filter:grayscale(.5);}

/* ★ 双人模式：卡片选中态（P1 青 / P2 粉） */
.card.sel-p1{
  border-color:#5ff0d0;
  background:linear-gradient(160deg, rgba(18,72,84,.7), rgba(8,28,42,.8));
  box-shadow:0 0 0 2px rgba(95,240,208,.4), 0 0 22px rgba(95,240,208,.25);
}
.card.sel-p2{
  border-color:#ff9fe6;
  background:linear-gradient(160deg, rgba(84,18,72,.7), rgba(42,8,34,.8));
  box-shadow:0 0 0 2px rgba(255,159,230,.4), 0 0 22px rgba(255,159,230,.25);
}
.card.sel-p1.sel-p2{
  border-color:#c8a2ff;
  box-shadow:0 0 0 2px rgba(200,162,255,.5), 0 0 24px rgba(200,162,255,.3);
}
.card .tag-p1,.card .tag-p2{
  position:absolute;left:6px;z-index:4;
  padding:1px 7px;border-radius:7px;
  font-size:10.5px;font-weight:700;letter-spacing:.5px;
}
.card .tag-p1{top:6px;background:#5ff0d0;color:#04222b;box-shadow:0 0 10px rgba(95,240,208,.6);}
.card .tag-p2{top:28px;background:#ff9fe6;color:#2b0422;box-shadow:0 0 10px rgba(255,159,230,.6);}

/* 可重复卡片的“可重复”角标 */
.card .repeat-tag{
  position:absolute;left:6px;bottom:6px;z-index:3;
  padding:1px 7px;border-radius:7px;
  font-size:10.5px;font-weight:700;letter-spacing:.5px;
  color:#04222b;background:#7fffe0;
  box-shadow:0 0 10px rgba(127,255,224,.65);
}

.card .name{
  font-size:12px;line-height:1.25;text-align:center;color:#cfe3ff;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card .cost{
  position:absolute;top:6px;right:6px;z-index:3;
  min-width:24px;height:22px;padding:0 6px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;
  backdrop-filter:blur(4px);
  cursor:pointer;
  transition:transform .14s ease, filter .14s ease;
}
.card .cost:hover{
  transform:scale(1.14);
  filter:brightness(1.45);
}

/* ★ 就地编辑费用的小输入框 */
.card .cost-input{
  position:absolute;top:5px;right:5px;z-index:7;
  width:58px;height:26px;padding:0 6px;
  border-radius:8px;
  background:rgba(5,14,32,.97);
  border:1px solid #5ff0d0;
  color:#5ff0d0;font-size:13px;font-weight:700;text-align:center;
  outline:none;font-family:inherit;
  box-shadow:0 0 16px rgba(95,240,208,.55);
  -moz-appearance:textfield;
}
.card .cost-input::-webkit-outer-spin-button,
.card .cost-input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}
main.duo .card .cost-input{top:4px;right:4px;width:52px;height:22px;font-size:11.5px;}

/* 精灵池锁定态（禁止阶段 / 结束后） */
.pool-locked .card{opacity:.42;filter:grayscale(.55);cursor:not-allowed;}
.pool-locked .card.sel-p1,.pool-locked .card.sel-p2{opacity:1;filter:none;}

/* ---------- 图标（随 --is 缩放） ---------- */
.icon-wrap{
  position:relative;
  width:calc(100px * var(--is,1));
  height:calc(100px * var(--is,1));
  flex:0 0 auto;
  border-radius:12px;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%, rgba(80,140,255,.2), rgba(8,16,38,.7));
  border:1px solid rgba(110,170,255,.15);
}
.icon-wrap::after{
  content:attr(data-initial);
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  font-size:calc(34px * var(--is,1));
  font-weight:700;
  color:rgba(140,190,255,.35);
  pointer-events:none;
}
.icon-wrap img{
  position:relative;z-index:1;
  width:calc(100px * var(--is,1));
  height:calc(100px * var(--is,1));
  object-fit:contain;
  display:block;
}

/* ---------- 出战阵容：2 列 ---------- */
.slots{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,auto);
  gap:10px;
}
.slot{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;padding:9px 6px 8px;border-radius:12px;
  min-height:104px;
  transition:.2s;
}
.slot.empty{
  border:1px dashed rgba(110,170,255,.22);
  background:rgba(10,18,40,.35);
  color:#3f5a86;font-size:24px;
}
.slot.filled{
  cursor:pointer;
  background:linear-gradient(160deg, rgba(22,70,84,.6), rgba(8,25,42,.75));
  border:1px solid rgba(95,240,208,.35);
  box-shadow:inset 0 0 22px rgba(95,240,208,.12);
}
.slot.filled.hoverable:hover{
  border-color:rgba(255,110,110,.7);
  box-shadow:inset 0 0 22px rgba(255,80,80,.15), 0 0 18px rgba(255,80,80,.25);
}
.slot.filled.hoverable:hover::after{
  content:"移除";
  position:absolute;inset:0;z-index:4;
  display:flex;align-items:center;justify-content:center;
  background:rgba(50,0,0,.6);
  color:#ffb3b3;font-size:13px;letter-spacing:2px;
  border-radius:inherit;
}

.slot .icon-wrap{
  width:calc(64px * var(--is,1));
  height:calc(64px * var(--is,1));
  border-radius:10px;
}
.slot .icon-wrap img{
  width:calc(64px * var(--is,1));
  height:calc(64px * var(--is,1));
}
.slot .icon-wrap::after{font-size:calc(22px * var(--is,1));}

.slot .name{
  font-size:12px;color:#cfe3ff;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.slot .cost{
  position:absolute;top:5px;right:5px;z-index:3;
  min-width:22px;height:19px;padding:0 6px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;
  backdrop-filter:blur(4px);
}

/* ★ 双人：被禁止的精灵 + 红色禁止图标 */
.slot.banned{cursor:not-allowed;}
.slot.banned .icon-wrap img,
.slot.banned .name{opacity:.35;filter:grayscale(1);}
.slot.banned .cost{opacity:.4;filter:grayscale(1);}
.ban-mark{
  position:absolute;inset:0;z-index:6;
  display:flex;align-items:center;justify-content:center;
  background:rgba(70,0,0,.45);
  border-radius:inherit;
  pointer-events:none;
}
.ban-mark::before{
  content:"";
  width:36px;height:36px;border-radius:50%;
  border:4px solid #ff3b3b;
  box-shadow:0 0 18px rgba(255,59,59,.9), inset 0 0 14px rgba(255,59,59,.45);
}
.ban-mark::after{
  content:"";
  position:absolute;left:50%;top:50%;
  width:46px;height:4px;border-radius:2px;
  background:#ff3b3b;
  transform:translate(-50%,-50%) rotate(-45deg);
  box-shadow:0 0 14px rgba(255,59,59,.95);
}

/* ---------- 统计 ---------- */
.total-row{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:14px;font-size:14px;color:#9fd4ff;letter-spacing:1px;
}
.total-row b{font-size:26px;color:#5ff0d0;text-shadow:0 0 16px rgba(95,240,208,.6);transition:.2s;}
.total-row b.warn{color:#ffd23f;text-shadow:0 0 16px rgba(255,210,63,.6);}
.total-row b.over{color:#ff6b6b;text-shadow:0 0 16px rgba(255,80,80,.6);}

/* 费用上限设置行 */
.limit-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:10px;font-size:13.5px;color:#9fd4ff;letter-spacing:1px;
}
.limit-row input{
  width:94px;padding:6px 10px;border-radius:9px;
  background:rgba(10,20,45,.8);
  border:1px solid rgba(110,170,255,.3);
  color:#5ff0d0;font-size:14px;font-weight:700;text-align:center;
  outline:none;font-family:inherit;transition:.2s;
  -moz-appearance:textfield;
}
.limit-row input::-webkit-outer-spin-button,
.limit-row input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}
.limit-row input:focus{
  border-color:#5ff0d0;
  box-shadow:0 0 14px rgba(95,240,208,.4);
  background:rgba(12,30,55,.9);
}

.bar{
  height:9px;border-radius:99px;margin-top:9px;
  background:rgba(8,20,45,.9);
  border:1px solid rgba(110,170,255,.15);
  overflow:hidden;
}
#bar{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#3fe0ff,#5ff0d0);
  transition:width .28s ease, background .28s;
  box-shadow:0 0 14px rgba(95,240,208,.6);
}
#bar.warn{background:linear-gradient(90deg,#ffd23f,#ff8a3f);box-shadow:0 0 14px rgba(255,160,63,.6);}
#bar.over{background:linear-gradient(90deg,#ff6b6b,#ff2d2d);box-shadow:0 0 14px rgba(255,60,60,.6);}

.actions{margin-top:14px;display:flex;gap:10px;}
button{
  flex:1;padding:10px;border-radius:10px;cursor:pointer;
  font-size:13px;letter-spacing:2px;font-family:inherit;
  background:rgba(20,45,90,.6);
  border:1px solid rgba(110,170,255,.3);
  color:#bfe0ff;transition:.2s;
}
button:hover{
  background:rgba(35,80,150,.75);
  border-color:#5ff0d0;color:#fff;
  box-shadow:0 0 18px rgba(95,240,208,.3);
}

button.primary{
  background:linear-gradient(135deg, rgba(26,86,150,.85), rgba(22,120,138,.8));
  border-color:rgba(95,240,208,.5);
  color:#dcfffa;
  text-shadow:0 0 12px rgba(95,240,208,.6);
}
button.primary:hover{
  background:linear-gradient(135deg, rgba(40,130,200,.95), rgba(32,175,180,.9));
  border-color:#7fffe0;
  box-shadow:0 0 22px rgba(95,240,208,.45);
}
button.primary:active{transform:scale(.98);}

/* ---------- 状态提示 ---------- */
.status{
  margin-top:12px;font-size:13px;color:#7f9cc9;letter-spacing:1px;line-height:1.7;
}
.status.ok{color:#5ff0d0;}
.status.err{color:#ff9a9a;}

.empty{text-align:center;color:#5c7396;padding:40px 0;font-size:14px;letter-spacing:2px;}

/* ---------- 固定底栏 ---------- */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:9;
  padding:12px 16px 14px;
  background:linear-gradient(to top, rgba(3,6,18,.98), rgba(3,6,18,.82) 62%, rgba(3,6,18,0));
  pointer-events:none;
}
.foot-inner{
  display:flex;align-items:center;justify-content:center;
  gap:12px;flex-wrap:wrap;
}
footer .line{
  display:inline-block;
  padding:8px 22px;
  border-radius:99px;
  border:1px solid rgba(110,170,255,.22);
  background:rgba(10,22,50,.5);
  backdrop-filter:blur(6px);
  font-size:clamp(12px,1.6vw,15px);
  letter-spacing:1.5px;
  color:#bfe0ff;
  text-shadow:0 0 12px rgba(80,180,255,.65), 0 0 30px rgba(80,180,255,.35);
}
.file-btn{
  pointer-events:auto;
  flex:0 0 auto;
  display:inline-flex;align-items:center;
  padding:9px 22px;border-radius:99px;cursor:pointer;
  background:rgba(20,45,90,.75);
  border:1px solid rgba(110,170,255,.4);
  color:#bfe0ff;font-size:13.5px;letter-spacing:2px;
  text-shadow:0 0 10px rgba(80,180,255,.5);
  transition:.2s;white-space:nowrap;
  font-family:inherit;
}
.file-btn:hover{
  border-color:#5ff0d0;color:#fff;
  background:rgba(28,72,120,.85);
  box-shadow:0 0 20px rgba(95,240,208,.35);
}
.file-btn:active{transform:scale(.97);}
.file-btn[disabled]{opacity:.55;cursor:progress;}

/* ★ 导出按钮：金色强调 */
.file-btn.export{
  border-color:rgba(255,210,63,.55);
  color:#ffe9a8;
  background:rgba(66,50,10,.75);
  text-shadow:0 0 10px rgba(255,210,63,.55);
}
.file-btn.export:hover{
  border-color:#ffd23f;color:#fff;
  background:rgba(96,74,16,.9);
  box-shadow:0 0 20px rgba(255,210,63,.4);
}

/* ★ 导出图片/压缩包按钮：青色强调 */
.file-btn.png{
  border-color:rgba(95,240,208,.55);
  color:#b8fff0;
  background:rgba(10,58,52,.75);
  text-shadow:0 0 10px rgba(95,240,208,.55);
}
.file-btn.png:hover{
  border-color:#7fffe0;color:#fff;
  background:rgba(14,86,76,.9);
  box-shadow:0 0 20px rgba(95,240,208,.4);
}

/* ★ 导出格式选择下拉 */
.format-select{
  pointer-events:auto;
  flex:0 0 auto;
  padding:9px 26px 9px 14px;
  border-radius:99px;cursor:pointer;
  background-color:rgba(10,58,52,.75);
  border:1px solid rgba(95,240,208,.55);
  color:#b8fff0;font-size:13px;letter-spacing:1px;
  font-family:inherit;
  text-shadow:0 0 10px rgba(95,240,208,.55);
  outline:none;
  -webkit-appearance:none;-moz-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23b8fff0' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 10px center;
  transition:.2s;
  white-space:nowrap;
}
.format-select:hover{
  border-color:#7fffe0;color:#fff;
  background-color:rgba(14,86,76,.9);
  box-shadow:0 0 20px rgba(95,240,208,.4);
}
.format-select option{
  background:#0a1330;
  color:#bfe0ff;
}

/* ★ 骰子按钮 */
.dice-btn{
  pointer-events:auto;
  display:inline-flex;align-items:center;gap:9px;
  padding:8px 20px 8px 12px;border-radius:99px;cursor:pointer;
  background:rgba(58,28,96,.8);
  border:1px solid rgba(180,130,255,.5);
  color:#e6d9ff;font-size:13.5px;letter-spacing:2px;
  text-shadow:0 0 10px rgba(180,130,255,.6);
  transition:.2s;white-space:nowrap;font-family:inherit;
  flex:0 0 auto;
}
.dice-btn:hover{
  border-color:#c9a0ff;color:#fff;
  background:rgba(82,42,138,.9);
  box-shadow:0 0 22px rgba(180,130,255,.45);
}
.dice-btn:active{transform:scale(.97);}
.dice-btn .dice-face{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:8px;
  background:linear-gradient(160deg,#ffffff,#d8d2ff);
  color:#220b3a;font-weight:800;font-size:15px;
  box-shadow:0 0 12px rgba(255,255,255,.4);
  transition:transform .12s;
}
.dice-btn.rolling .dice-face{animation:diceSpin .16s linear infinite;}
@keyframes diceSpin{

  50%{transform:rotate(180deg) scale(1.25);}

/* ============ ★ 双人模式布局 ============ */
#duoBar,#p1Panel,#p2Panel{display:none;}

main.duo{grid-template-columns:320px minmax(0,1fr) 320px;}
main.duo #duoBar{display:flex;grid-column:1 / -1;grid-row:1;}
main.duo #p1Panel{display:block;grid-column:1;grid-row:2;}
main.duo #poolPanel{grid-column:2;grid-row:2;}
main.duo #p2Panel{display:block;grid-column:3;grid-row:2;}
main.duo #soloPanel{display:none;}
main.duo .pool-scroll{max-height:calc(100vh - 372px);}

/* ★★★ 双人模式：精灵池紧凑化（图标变小，一屏容纳更多精灵） ★★★ */
main.duo .cost-group{margin-bottom:12px;}
main.duo .cost-group:last-child{margin-bottom:4px;}
main.duo .group-head{padding:0 2px 5px;margin-bottom:8px;gap:8px;}
main.duo .group-badge{min-width:40px;height:19px;padding:0 8px;font-size:11.5px;border-radius:7px;}
main.duo .group-count{font-size:11px;}
main.duo .group-grid{
  grid-template-columns:repeat(auto-fill,minmax(calc(78px * var(--is,1)),1fr));
  gap:8px;
}
main.duo .card{padding:6px 4px 6px;border-radius:10px;gap:4px;}
main.duo .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,160,255,.22);}
main.duo .icon-wrap{
  width:calc(62px * var(--is,1));
  height:calc(62px * var(--is,1));
  border-radius:9px;
}
main.duo .icon-wrap img{
  width:calc(62px * var(--is,1));
  height:calc(62px * var(--is,1));
}
main.duo .icon-wrap::after{font-size:calc(23px * var(--is,1));}
main.duo .card .name{font-size:10.5px;line-height:1.2;}
main.duo .card .cost{
  top:4px;right:4px;min-width:20px;height:18px;padding:0 5px;
  border-radius:6px;font-size:10.5px;
}
main.duo .card.selected::before{
  left:4px;top:4px;width:15px;height:15px;line-height:15px;font-size:10px;
}
main.duo .card .repeat-tag{
  left:4px;bottom:4px;padding:0 5px;border-radius:6px;font-size:9.5px;
}
main.duo .card .tag-p1,main.duo .card .tag-p2{
  left:4px;padding:0 5px;border-radius:6px;font-size:9.5px;
}
main.duo .card .tag-p1{top:4px;}
main.duo .card .tag-p2{top:21px;}

@media (max-width:1240px){
  main.duo{grid-template-columns:1fr 1fr;}
  main.duo #duoBar{grid-column:1 / -1;grid-row:1;}
  main.duo #poolPanel{grid-column:1 / -1;grid-row:2;}
  main.duo #p1Panel{grid-column:1;grid-row:3;}
  main.duo #p2Panel{grid-column:2;grid-row:3;}
}
@media (max-width:700px){
  main.duo{grid-template-columns:1fr;}
  main.duo #p1Panel{grid-column:1;grid-row:3;}
  main.duo #p2Panel{grid-column:1;grid-row:4;}
}

/* ---------- 双人设置弹窗 ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  display:none;
  align-items:center;justify-content:center;
  padding:20px;
  background:rgba(2,4,12,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  width:min(440px,94vw);
  max-height:92vh;overflow-y:auto;
  background:linear-gradient(160deg, rgba(16,30,64,.98), rgba(8,14,34,.98));
  border:1px solid rgba(110,170,255,.35);
  border-radius:20px;
  padding:24px 26px 22px;
  box-shadow:0 0 60px rgba(40,90,200,.45), inset 0 0 40px rgba(40,90,200,.08);
  animation:modalIn .22s ease;
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(14px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.modal-box h3{
  margin:0 0 18px;font-size:18px;letter-spacing:4px;color:#9fd4ff;
  text-align:center;text-shadow:0 0 14px rgba(80,160,255,.55);font-weight:700;
}
.modal-box h3::before{content:"✦ ";color:#5ff0d0;}
.modal-field{
  display:flex;align-items:center;gap:10px;margin-bottom:13px;
  font-size:13.5px;color:#9fc4ea;letter-spacing:1px;
}
.modal-field label{flex:0 0 108px;cursor:pointer;}
.modal-field input[type=number]{
  flex:1;min-width:0;padding:8px 12px;border-radius:10px;
  background:rgba(10,20,45,.85);
  border:1px solid rgba(110,170,255,.3);
  color:#5ff0d0;font-size:14px;font-weight:700;text-align:center;
  outline:none;font-family:inherit;
  -moz-appearance:textfield;
  transition:.2s;
}
.modal-field input[type=number]::-webkit-outer-spin-button,
.modal-field input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.modal-field input[type=text]{
  flex:1;min-width:0;padding:8px 12px;border-radius:10px;
  background:rgba(10,20,45,.85);
  border:1px solid rgba(110,170,255,.3);
  color:#5ff0d0;font-size:13px;font-weight:700;letter-spacing:1px;
  outline:none;font-family:inherit;transition:.2s;
}
.modal-field input:focus{
  border-color:#5ff0d0;
  box-shadow:0 0 14px rgba(95,240,208,.4);
  background:rgba(12,30,55,.95);
}
.modal-field input::placeholder{color:#5c7396;font-weight:400;letter-spacing:0;}
.modal-hint{
  font-size:11.5px;color:#6f8cb5;line-height:1.75;letter-spacing:.4px;
  margin:4px 0 18px;
  padding:10px 12px;border-radius:10px;
  background:rgba(10,22,50,.5);
  border:1px solid rgba(110,170,255,.12);
}
.modal-actions{display:flex;gap:12px;}
.modal-btn-start{
  flex:1;padding:12px;border-radius:12px;
  font-size:14px;letter-spacing:3px;
  background:linear-gradient(135deg, rgba(26,86,150,.9), rgba(22,120,138,.85));
  border:1px solid rgba(95,240,208,.5);
  color:#dcfffa;text-shadow:0 0 12px rgba(95,240,208,.6);
  cursor:pointer;font-family:inherit;transition:.2s;
}
.modal-btn-start:hover{
  background:linear-gradient(135deg, rgba(40,130,200,.95), rgba(32,175,180,.9));
  border-color:#7fffe0;
  box-shadow:0 0 22px rgba(95,240,208,.45);
}
.modal-btn-start:active{transform:scale(.98);}
.modal-btn-cancel{
  flex:0 0 auto;padding:12px 20px;border-radius:12px;
  font-size:13px;letter-spacing:2px;
  background:rgba(20,45,90,.6);
  border:1px solid rgba(110,170,255,.3);
  color:#bfe0ff;cursor:pointer;font-family:inherit;transition:.2s;
}
.modal-btn-cancel:hover{
  background:rgba(35,80,150,.75);
  border-color:rgba(255,150,150,.6);color:#fff;
}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:132px;z-index:20;
  transform:translate(-50%,16px);
  padding:11px 22px;border-radius:12px;
  background:rgba(60,10,20,.9);
  border:1px solid rgba(255,110,110,.5);
  color:#ffd7d7;font-size:13.5px;letter-spacing:1px;
  opacity:0;pointer-events:none;
  transition:opacity .25s, transform .25s;
  box-shadow:0 0 26px rgba(255,60,60,.35);
  white-space:nowrap;
  max-width:90vw;
  overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast.good{
  background:rgba(8,50,44,.92);
  border-color:rgba(95,240,208,.6);
  color:#c8fff4;
  box-shadow:0 0 26px rgba(95,240,208,.4);
}
